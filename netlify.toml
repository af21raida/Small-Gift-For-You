# Netlify configuration — My Love For You
#
# Build:   node scripts/build.mjs   (zero dependencies; fingerprints assets into dist/assets/**)
# Publish: dist/
# Functions: netlify/functions (Supabase-backed gift API; see docs/DEPLOYMENT.md)

[build]
  command   = "node scripts/build.mjs"
  publish   = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

# ---------------------------------------------------------------------------
# Share links: https://<site>/g/<20-char-code> -> g.html (loading shell, noindex).
# The function API lives at /api/* (declared in each function's `config.path`).
# ---------------------------------------------------------------------------
[[redirects]]
  from   = "/g/*"
  to     = "/g.html"
  status = 200

# ---------------------------------------------------------------------------
# Caching
#   /assets/**  content-fingerprinted file names (name.<hash>.ext) -> can never change
#               under the same URL -> 1 year + immutable.
#   everything else (index.html, g.html, 404.html, robots.txt) keeps the same URL while its
#   content changes -> must always revalidate so returning visitors see new deploys
#   (Netlify answers revalidation with a cheap 304).
#   Text assets are compressed (gzip/brotli) automatically by Netlify's CDN; AVIF/WebP/
#   PNG/MP3/WOFF2 are already compressed formats.
# ---------------------------------------------------------------------------
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# Share links are bearer secrets: keep them out of search indexes and caches.
[[headers]]
  for = "/g/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Robots-Tag  = "noindex, nofollow"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag  = "noindex"

# ---------------------------------------------------------------------------
# Security headers (all pages)
#  - Referrer-Policy: no-referrer  => the secret /g/<code> URL is never leaked to external
#    image/audio hosts through the Referer header.
#  - CSP: scripts and styles only from this origin (no inline scripts). Images/audio may
#    come from any https host because creators can paste external photo / song links.
# ---------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options     = "nosniff"
    X-Frame-Options            = "DENY"
    Referrer-Policy            = "no-referrer"
    Permissions-Policy         = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Strict-Transport-Security  = "max-age=31536000; includeSubDomains"
    Content-Security-Policy    = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; font-src 'self'; connect-src 'self' data: https://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
